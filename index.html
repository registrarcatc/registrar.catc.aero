<!-- Modal QUICK START GUIDE (Interactive 5 ขั้นตอน) -->
  <div id="guideModal" class="modal" onclick="if(event.target === this) closeGuideModal()">
    <div class="guide-modal-content">
      <!-- ส่วนหัว: QUICK START GUIDE และปุ่ม ข้าม × -->
      <div class="flex items-center justify-between text-xs font-bold tracking-wider text-gray-500 uppercase mb-2.5">
        <span>QUICK START GUIDE</span>
        <button type="button" onclick="closeGuideModal()" class="text-gray-600 hover:text-gray-900 font-bold text-xs flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-gray-100 transition">
          <span>ข้าม</span>
          <span class="text-base leading-none">&times;</span>
        </button>
      </div>

      <!-- แถบความคืบหน้า 5 ขั้นตอน -->
      <div id="guideProgressBars" class="grid grid-cols-5 gap-1.5 mb-4">
        <div class="h-1 rounded-full bg-blue-600 transition-all"></div>
        <div class="h-1 rounded-full bg-gray-200 transition-all"></div>
        <div class="h-1 rounded-full bg-gray-200 transition-all"></div>
        <div class="h-1 rounded-full bg-gray-200 transition-all"></div>
        <div class="h-1 rounded-full bg-gray-200 transition-all"></div>
      </div>

      <!-- กรอบภาพประกอบแต่ละ Step -->
      <div id="guideIllustrationBox" class="w-full h-56 md:h-64 rounded-2xl bg-blue-50/70 flex items-center justify-center p-4 overflow-hidden mb-4"></div>

      <!-- หมายเลข STEP, หัวข้อ และคำอธิบาย -->
      <p id="guideStepCounter" class="text-xs font-bold tracking-wider text-blue-600 uppercase">STEP 01 / 05</p>
      <h3 id="guideStepTitle" class="text-lg md:text-xl font-bold text-gray-900 mt-1">-</h3>
      <p id="guideStepDesc" class="text-xs md:text-sm text-gray-500 mt-1.5 leading-relaxed min-h-[2.75rem]">-</p>

      <!-- จุดไข่ปลาแสดงตำแหน่ง Step -->
      <div id="guideDots" class="flex items-center justify-center gap-1.5 my-4"></div>

      <!-- ปุ่มย้อนกลับ และ ถัดไป -->
      <div class="flex items-center justify-between gap-3 pt-1">
        <button type="button" id="guidePrevBtn" onclick="prevGuideStep()" class="px-5 py-2.5 rounded-full border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 text-xs md:text-sm font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-chevron-left text-xs"></i>
          <span>ย้อนกลับ</span>
        </button>

        <button type="button" id="guideNextBtn" onclick="nextGuideStep()" class="px-6 py-2.5 rounded-full bg-gray-900 hover:bg-black text-white text-xs md:text-sm font-bold shadow transition flex items-center gap-1.5">
          <span id="guideNextLabel">ถัดไป</span>
          <i id="guideNextIcon" class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>
